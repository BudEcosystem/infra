apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: awslz
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - name: argocd
            namespace: argocd
            repoURL: registry.bud.studio/charts
            chart: argocd
            targetRevision: "0.1.1"
            valueFiles:
              - "$values/values/argocd/secrets.awslz.yaml"
              - "$values/values/argocd/values.budruntime.yaml"
              - "$values/values/argocd/values.awslz.yaml"
          - name: dapr
            namespace: dapr-system
            repoURL: https://dapr.github.io/helm-charts
            chart: dapr
            targetRevision: "1.17.5"
            valueFiles:
              - "$values/values/dapr/values.yaml"
          - name: kafka
            namespace: kafka
            repoURL: registry.bud.studio/charts
            chart: kafka
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/kafka/values.budruntime.yaml"
          - name: mongodb
            namespace: mongodb
            repoURL: registry.bud.studio/charts
            chart: mongodb
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/mongodb/values.budruntime.yaml"
          - name: cert-manager
            namespace: cert-manager
            repoURL: registry.bud.studio/charts
            chart: cert-manager
            targetRevision: "0.1.3"
            valueFiles:
              - "$values/values/cert-manager/values.budruntime.yaml"
              - "$values/values/cert-manager/values.demo.yaml"
              - "$values/values/cert-manager/secrets.demo.yaml"
          - name: clickhouse
            namespace: clickhouse
            repoURL: registry.bud.studio/charts
            chart: clickhouse
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/clickhouse/values.budruntime.yaml"
          - name: postgres
            namespace: postgres
            repoURL: registry.bud.studio/charts
            chart: postgres
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/postgres/values.budruntime.yaml"
              - "$values/values/postgres/values.minimal.budruntime.yaml"
          - name: seaweedfs
            namespace: seaweedfs
            repoURL: registry.bud.studio/charts
            chart: seaweedfs
            targetRevision: "0.1.1"
            valueFiles:
              - "example.minimal.yaml"
              - "$values/values/seaweedfs/values.budruntime.yaml"
              - "$values/values/seaweedfs/values.awslz.yaml"
          - name: valkey
            namespace: valkey
            repoURL: registry-1.docker.io/cloudpirates
            chart: valkey
            targetRevision: "0.21.4"
            valueFiles:
              - "$values/values/valkey/values.yaml"
              - "$values/values/valkey/values.minimal.yaml"
              - "$values/values/valkey/values.budruntime.yaml"
          - name: keycloak
            namespace: keycloak
            repoURL: registry.bud.studio/charts
            chart: keycloak
            targetRevision: "0.2.1"
            valueFiles:
              - "$values/values/keycloak/values.budruntime.yaml"
              - "$values/values/keycloak/values.awslz.yaml"
              - "$values/values/keycloak/secrets.demo.yaml"
          - name: bud
            namespace: bud
            repoURL: registry.bud.studio/charts
            chart: bud
            targetRevision: "1.2.5"
            valueFiles:
              - "$values/values/bud/secrets.demo.yaml"
              - "$values/values/bud/values.awslz.yaml"
  template:
    metadata:
      name: "awslz-{{.name}}"
    spec:
      project: awslz
      destination:
        server: "https://kubernetes.default.svc"
        namespace: "{{.namespace}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        automated:
          enabled: false
          selfHeal: true
  templatePatch: |
    spec:
      sources:
        - repoURL: {{ .repoURL | quote }}
          chart: {{ .chart | quote }}
          targetRevision: {{ .targetRevision | quote }}
          helm:
            releaseName: "{{.name}}"
            valueFiles:
              {{- .valueFiles | toYaml | nindent 12  }}
        - repoURL: "https://github.com/BudEcosystem/infra.git"
          targetRevision: HEAD
          ref: values
