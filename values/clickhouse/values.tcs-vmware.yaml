# GPU Foundry's tenant-log store, on this cluster's shared ClickHouse (M3 D8, close-out).
#
# ONE DATABASE, FOUR USERS, AND NO USER OWNS IT. gpu-foundry designed tenant logs for a
# ClickHouse of their own; on this shared dev cluster they live in a `tenant_logs`
# database here instead. Sharing the instance gives up the FAILURE boundary; the
# credential boundary is kept, which is why nothing below is listed under `databases:` —
# the chart grants ALL on a listed database, and ALL includes deleting a tenant's lines.
# Every privilege is an explicit GRANT, per table, per verb:
#
#   foundry_logs_schema     creates the database and tables, and may change a TTL.
#                           No INSERT, no SELECT on a tenant table, no DELETE.
#   foundry_logs_collector  the OTel collector: INSERT lines, and SHOW COLUMNS for the
#                           exporter's start-up probe. Cannot read a tenant's lines.
#   foundry_logs_reader     foundry-api: SELECT lines and session recordings. Cannot write.
#   foundry_logs_recorder   access-gateway: INSERT session recordings. Cannot read anything,
#                           so the process holding a live shell cannot read past sessions.
#                           Also CREATE TEMPORARY TABLE, which ClickHouse requires for the
#                           input() table function the recorder's INSERT converts its
#                           nanosecond timestamps through. Without it every chunk was
#                           refused (Code 497) while the gateway reported recordings ON.
#                           It creates session-scoped tables only; reading another source
#                           through a table function needs a source grant it does not hold.
#
# TWO TABLES, NOT FOUR: this store is one shard, so gpu-foundry's schema creates `lines` and
# `session_recordings` as plain MergeTree tables, with no Distributed layer and no per-shard
# tables for these grants to reach.
#
# GRANTS ON TABLES THAT DO NOT EXIST YET ARE VALID: ClickHouse stores the grant, and
# gpu-foundry's schema Job creates the tables afterwards — then checks, as each user, that
# the collector cannot read and the reader cannot write, that the recorder can write the
# gateway's exact statement and cannot read, and fails its sync otherwise.
#
# UNDERSCORES ARE SAFE HERE, unlike the Postgres roles: these names reach ClickHouse and
# nothing in Kubernetes. LAST in valueFiles and additive — `users` is a map, so bud's entry
# is untouched.
#
# PLAINTEXT, like values/postgres/values.tcs-vmware.yaml, for the reason given there.
users:
  foundry_logs_schema:
    password: "ad5ddc523956c205a24598882d12c8b5266d06dbf865a3d0"
    grants:
      - CREATE DATABASE ON tenant_logs.*
      - CREATE TABLE ON tenant_logs.*
      - ALTER TTL ON tenant_logs.*
      - SHOW TABLES ON tenant_logs.*
      - SELECT ON system.tables
  foundry_logs_collector:
    password: "309147c33ba843ce0bf21cde400e3e7e2cf597449eba6b96"
    grants:
      - INSERT ON tenant_logs.lines
      - SHOW COLUMNS ON tenant_logs.lines
  foundry_logs_reader:
    password: "c2027d3fa3f6f678a52b64a885f8497a0792c99336290dff"
    grants:
      - SELECT ON tenant_logs.lines
      - SELECT ON tenant_logs.session_recordings
  foundry_logs_recorder:
    password: "8dd3339edff302188561873a4a5e7294ea4295a863cb89fb"
    grants:
      - INSERT ON tenant_logs.session_recordings
      - CREATE TEMPORARY TABLE ON *.*
