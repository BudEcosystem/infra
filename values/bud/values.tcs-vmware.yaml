ingress:
    https: internal
global:
    ingress:
        hosts:
            root: "tcs-vmware.bud-demo.com"

externalServices:
    oidc:
        url: "https://auth.tcs-vmware.bud-demo.com/realms/bud-keycloak"
    s3:
        endpoint: "s3.tcs-vmware.bud-demo.com"
        secure: true

microservices:
    budapp:
        redirectFlow:
            clientsByHost:
                budadmin:
                    hosts:
                        - '{{ include "bud.ingress.hosts.budadmin" . }}'
                    allowedReturnUrlOrigins:
                        - '{{ include "bud.ingress.url.budadmin" . }}'
                budcustomer:
                    hosts:
                        - '{{ include "bud.ingress.hosts.budcustomer" . }}'
                    allowedReturnUrlOrigins:
                        - '{{ include "bud.ingress.url.budcustomer" . }}'
                budplayground:
                    hosts:
                        - '{{ include "bud.ingress.hosts.budplayground" . }}'
                    allowedReturnUrlOrigins:
                        - '{{ include "bud.ingress.url.budplayground" . }}'
    budadmin:
        env:
            # Served from the node dir mounted by the kyverno inject-budadmin-logo
            # policy (values/kyverno/values.inject-logo.yaml) into public/branding.
            NEXT_PUBLIC_LOGO_URL: "/branding/logo.png"
            NEXT_PUBLIC_LOGO_AUTH_URL: "/branding/logo.png"
    budcustomer:
        # :nightly carries PR #2723 (branding env support), not yet in a release.
        image: registry.bud.studio/runtime/budcustomer:nightly
        env:
            # Absolute URL, not /branding/... — budcustomer is a nix build and
            # serves public/ from a read-only, hash-versioned /nix/store path, so
            # the kyverno hostPath mount used for budadmin cannot reach it.
            # Served here by budadmin, which does have the file mounted.
            # LIGHT and AUTH mirror LOGO_URL when unset.
            NEXT_PUBLIC_LOGO_URL: "https://admin.tcs-vmware.bud-demo.com/branding/logo.png"
    budsim:
        env:
            # Single/master-only node cluster: allow CPU deployments on control-plane nodes
            SKIP_MASTER_NODE_FOR_CPU: "false"
    budcluster:
        env:
            # Single/master-only node cluster: allow model-transfer and runtime pods
            # to schedule on the control-plane node (drops the master-excluding affinity)
            SKIP_MASTER_NODE_FOR_CPU: "false"
