ingress:
    https: internal
    isTraefik: false
    className: openshift-default
global:
    ingress:
        hosts:
            root: "openshift.bud-demo.com"

externalServices:
    oidc:
        url: "https://auth.openshift.bud-demo.com/realms/bud-keycloak"
    s3:
        endpoint: "s3.openshift.bud-demo.com"
        secure: true

microservices:
    budapp:
        redirectFlow:
            clientsByHost:
                budadmin:
                    hosts:
                        - '{{ include "bud.ingress.hosts.budadmin" . }}'
                    allowedReturnUrlOrigins:
                        - '{{ include "bud.ingress.url.budadmin" . }}'
                budcustomer:
                    hosts:
                        - '{{ include "bud.ingress.hosts.budcustomer" . }}'
                    allowedReturnUrlOrigins:
                        - '{{ include "bud.ingress.url.budcustomer" . }}'
                budplayground:
                    hosts:
                        - '{{ include "bud.ingress.hosts.budplayground" . }}'
                    allowedReturnUrlOrigins:
                        - '{{ include "bud.ingress.url.budplayground" . }}'
    budsim:
        env:
            # Single/master-only node cluster: allow CPU deployments on control-plane nodes
            SKIP_MASTER_NODE_FOR_CPU: "false"
    budcluster:
        env:
            # Single/master-only node cluster: allow model-transfer and runtime pods
            # to schedule on the control-plane node (drops the master-excluding affinity)
            SKIP_MASTER_NODE_FOR_CPU: "false"
    semanticRouter:
        enabled: false
    buddoc:
        enabled: false
    askbud:
        enabled: false
    budcodeinterpreter:
        enabled: false
    budcustomer:
        enabled: false
    budpipeline:
        enabled: false
    budsentinel:
        enabled: false
