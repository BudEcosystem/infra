global:
  domain: argocd.tcs-vmware.bud-demo.com

ingress:
  enabled: true
  host: argocd.tcs-vmware.bud-demo.com

repo:
  enabled: true
  url: https://github.com/BudEcosystem/infra

argo-cd:
  configs:
    cm:
      url: https://argocd.tcs-vmware.bud-demo.com

projects:
  tcs-vmware:
    clusterResourceWhitelist:
      - group: "*"
        kind: "*"
    destinations:
      - namespace: "*"
        server: "https://kubernetes.default.svc"
    sourceRepos:
      - "*"
